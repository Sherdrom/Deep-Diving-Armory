name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        env:
          # Keep the runner's preinstalled SDKs out of version selection.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dda-dotnet
        with:
          dotnet-version: 8.0.x

      - name: Run Lua tests
        shell: bash
        run: |
          set -euo pipefail
          for test in .UnitTests/Lua/*.test.lua; do
            # These scripts require a running single-player game session.
            [[ "$test" == .UnitTests/Lua/VirtualMagazineRuntime*.test.lua ]] && continue
            lua5.4 "$test"
          done

      - name: Validate XML syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET

          files = subprocess.check_output(
              ["git", "ls-files", "-z", "*.xml"]
          ).split(b"\0")

          count = 0
          for raw_path in files:
              if not raw_path:
                  continue
              path = Path(os.fsdecode(raw_path))
              try:
                  ET.parse(path)
              except (ET.ParseError, OSError) as error:
                  raise SystemExit(f"{path}: {error}") from error
              count += 1

          print(f"Validated {count} XML files.")
          PY

      - name: Build C# plugins
        shell: bash
        run: .Tools/build-csharp.sh "$RUNNER_TEMP/mod"

      - name: Build C# test projects and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          export DdaBin="$RUNNER_TEMP/mod/bin"
          for project in .UnitTests/CSharp/*/*.csproj; do
            dotnet build "$project" -c Release -m:1
          done
          dotnet test .UnitTests/CSharp/EntitySpawnerBudget -c Release --no-build
          dotnet test .UnitTests/CSharp/UnstableCompatibility -c Release --no-build
          dotnet test .UnitTests/CSharp/UnstableCompatibility -c Release -m:1 -p:BuildTarget=Server
          dotnet run --project .UnitTests/CSharp/DeepAmmoLoaderRegression -c Release --no-build

      - name: Verify C# deployment
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/mod" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          deploy_root = Path(sys.argv[1])
          registrations = ET.parse("filelist.xml").getroot().findall("PluginInfo")
          if [r.get("file") for r in registrations] != ["%ModDir%/PluginInfo.xml"]:
              raise SystemExit("The content package must register PluginInfo.xml exactly once")
          assemblies = ET.parse("PluginInfo.xml").getroot().findall("MainAssemblyInfo")
          expected = {(p, t) for p in ("Windows", "Linux", "Mac") for t in ("Client", "Server")}
          actual = [(a.attrib["platforms"], a.attrib["targets"]) for a in assemblies]
          if len(actual) != 6 or set(actual) != expected:
              raise SystemExit(f"Invalid plugin matrix: {actual}")

          missing = []
          for assembly in assemblies:
              relative = assembly.attrib["assemblypath"].replace("%ModDir%", "", 1).lstrip("/\\")
              dll = deploy_root.joinpath(*relative.replace("\\", "/").split("/"))
              deps = dll.with_suffix(".deps.json")
              for path in (dll, deps):
                  if not path.is_file():
                      missing.append(str(path))

          if missing:
              raise SystemExit("Missing deployed files:\n" + "\n".join(missing))
          print(f"Verified {len(assemblies)} DLLs and matching deps.json files.")
          PY

      - name: Check release package
        shell: bash
        run: &package_release |
          python3 - "$RUNNER_TEMP/mod" "$RUNNER_TEMP/Deep-Diving-Armory.zip" <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from zipfile import ZIP_DEFLATED, ZipFile


          def package_release(repo_root, deploy_root, archive):
              required = set()
              for assembly in ET.parse(repo_root / "PluginInfo.xml").getroot().findall("MainAssemblyInfo"):
                  relative = assembly.attrib["assemblypath"].replace("%ModDir%", "", 1).lstrip("/\\")
                  dll = Path(relative.replace("\\", "/"))
                  required.update((dll, dll.with_suffix(".deps.json")))
              missing = sorted(str(path) for path in required if not (deploy_root / path).is_file())
              if missing:
                  raise ValueError("Missing freshly built files:\n" + "\n".join(missing))

              tracked = subprocess.check_output(["git", "ls-files", "-z"], cwd=repo_root).split(b"\0")
              files = {}
              for raw_path in tracked:
                  if not raw_path:
                      continue
                  path = Path(os.fsdecode(raw_path))
                  if path.parts[0] != "bin" and not any(part.startswith(".") for part in path.parts):
                      files[path] = repo_root / path
              for relative in required:
                  files[relative] = deploy_root / relative

              with ZipFile(archive, "w", ZIP_DEFLATED) as release:
                  for relative, source in sorted(files.items()):
                      release.write(source, relative.as_posix())

              with ZipFile(archive) as release:
                  names = set(release.namelist())
                  hidden = [name for name in names if any(part.startswith(".") for part in Path(name).parts)]
                  missing = sorted(path.as_posix() for path in required if path.as_posix() not in names)
                  if hidden or missing:
                      raise ValueError(f"Invalid release archive: hidden={hidden}, missing={missing}")
                  corrupt = release.testzip()
                  if corrupt:
                      raise ValueError("Corrupt release entry: " + corrupt)
              print(f"Packaged {len(files)} files; verified {len(required)} assembly outputs.")


          if __name__ == "__main__":
              package_release(Path.cwd(), Path(sys.argv[1]), Path(sys.argv[2]))
          PY

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        env:
          # Keep the runner's preinstalled SDKs out of version selection.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dda-dotnet
        with:
          dotnet-version: 8.0.x

      - name: Build C# plugins
        shell: bash
        run: .Tools/build-csharp.sh "$RUNNER_TEMP/mod"

      - name: Package release
        shell: bash
        run: *package_release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/Deep-Diving-Armory.zip" --verify-tag --generate-notes
