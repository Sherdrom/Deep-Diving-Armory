name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Run Lua tests
        shell: bash
        run: |
          set -euo pipefail
          for test in .UnitTests/Lua/*.test.lua; do
            lua5.4 "$test"
          done

      - name: Run PowerShell tests
        shell: pwsh
        run: ./.UnitTests/PowerShell/WeaponXmlOptimization.test.ps1

      - name: Run C# unit tests when present
        shell: bash
        run: |
          set -euo pipefail
          projects=()
          if [[ -d .UnitTests/CSharp ]]; then
            mapfile -t projects < <(find .UnitTests/CSharp -type f -name '*.csproj' -print)
          fi
          if ((${#projects[@]} == 0)); then
            echo "::notice::No C# unit test projects found under .UnitTests/CSharp"
          else
            for project in "${projects[@]}"; do
              dotnet test "$project" -c Release -m:1
            done
          fi

      - name: Build C# plugins
        shell: bash
        run: .Tools/build-csharp.sh "$RUNNER_TEMP/mod"

      - name: Verify C# deployment
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/mod" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          deploy_root = Path(sys.argv[1])
          assemblies = ET.parse("ModConfig.xml").getroot().findall("./Assembly")
          assert len(assemblies) == 24, f"expected 24 assemblies, found {len(assemblies)}"

          missing = []
          for assembly in assemblies:
              relative = assembly.attrib["File"].replace("%ModDir%", "", 1).lstrip("/\\")
              dll = deploy_root.joinpath(*relative.replace("\\", "/").split("/"))
              deps = dll.with_suffix(".deps.json")
              for path in (dll, deps):
                  if not path.is_file():
                      missing.append(str(path))

          if missing:
              raise SystemExit("Missing deployed files:\n" + "\n".join(missing))
          print(f"Verified {len(assemblies)} DLLs and matching deps.json files.")
          PY

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build C# plugins
        shell: bash
        run: .Tools/build-csharp.sh

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Deep-Diving-Armory.zip"
          python3 - "$archive" <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          from zipfile import ZIP_DEFLATED, ZipFile

          archive = Path(sys.argv[1])
          tracked = subprocess.run(
              ["git", "ls-files", "-z"], check=True, capture_output=True
          ).stdout.split(b"\0")
          files = []
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = Path(os.fsdecode(raw_path))
              if not any(part.startswith(".") for part in path.parts):
                  files.append(path)

          with ZipFile(archive, "w", ZIP_DEFLATED) as release:
              for path in files:
                  release.write(path, path.as_posix())

          with ZipFile(archive) as release:
              hidden = [
                  name for name in release.namelist()
                  if any(part.startswith(".") for part in Path(name).parts)
              ]
          if hidden:
              raise SystemExit("Release archive contains hidden paths:\n" + "\n".join(hidden))
          print(f"Packaged {len(files)} files without hidden paths.")
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/Deep-Diving-Armory.zip" --verify-tag --generate-notes
