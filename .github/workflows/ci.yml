name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Run Lua tests
        shell: bash
        run: |
          set -euo pipefail
          for test in .UnitTests/Lua/*.test.lua; do
            lua5.4 "$test"
          done

      - name: Validate XML syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET

          files = subprocess.check_output(
              ["git", "ls-files", "-z", "*.xml"]
          ).split(b"\0")

          count = 0
          for raw_path in files:
              if not raw_path:
                  continue
              path = Path(os.fsdecode(raw_path))
              try:
                  ET.parse(path)
              except (ET.ParseError, OSError) as error:
                  raise SystemExit(f"{path}: {error}") from error
              count += 1

          print(f"Validated {count} XML files.")
          PY

      - name: Run C# unit tests when present
        shell: bash
        run: |
          set -euo pipefail
          projects=()
          if [[ -d .UnitTests/CSharp ]]; then
            mapfile -t projects < <(find .UnitTests/CSharp -type f -name '*.csproj' -print)
          fi
          if ((${#projects[@]} == 0)); then
            echo "::notice::No C# unit test projects found under .UnitTests/CSharp"
          else
            for project in "${projects[@]}"; do
              dotnet test "$project" -c Release -m:1
            done
          fi

      - name: Build C# plugins
        shell: bash
        run: .Tools/build-csharp.sh "$RUNNER_TEMP/mod"

      - name: Verify C# deployment
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/mod" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          deploy_root = Path(sys.argv[1])
          assemblies = ET.parse("ModConfig.xml").getroot().findall("./Assembly")

          missing = []
          for assembly in assemblies:
              relative = assembly.attrib["File"].replace("%ModDir%", "", 1).lstrip("/\\")
              dll = deploy_root.joinpath(*relative.replace("\\", "/").split("/"))
              deps = dll.with_suffix(".deps.json")
              for path in (dll, deps):
                  if not path.is_file():
                      missing.append(str(path))

          if missing:
              raise SystemExit("Missing deployed files:\n" + "\n".join(missing))
          print(f"Verified {len(assemblies)} DLLs and matching deps.json files.")
          PY

      - name: Check release package
        shell: bash
        run: &package_release |
          python3 - "$RUNNER_TEMP/mod" "$RUNNER_TEMP/Deep-Diving-Armory.zip" <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from zipfile import ZIP_DEFLATED, ZipFile


          def package_release(repo_root, deploy_root, archive):
              required = set()
              for assembly in ET.parse(repo_root / "ModConfig.xml").getroot().findall("./Assembly"):
                  relative = assembly.attrib["File"].replace("%ModDir%", "", 1).lstrip("/\\")
                  dll = Path(relative.replace("\\", "/"))
                  required.update((dll, dll.with_suffix(".deps.json")))
              missing = sorted(str(path) for path in required if not (deploy_root / path).is_file())
              if missing:
                  raise ValueError("Missing freshly built files:\n" + "\n".join(missing))

              tracked = subprocess.check_output(["git", "ls-files", "-z"], cwd=repo_root).split(b"\0")
              files = {}
              for raw_path in tracked:
                  if not raw_path:
                      continue
                  path = Path(os.fsdecode(raw_path))
                  if path.parts[0] != "bin" and not any(part.startswith(".") for part in path.parts):
                      files[path] = repo_root / path
              # Never fall back to checked-in binaries: only this build's output is shipped.
              for path in (deploy_root / "bin").rglob("*"):
                  if path.is_file():
                      files[path.relative_to(deploy_root)] = path

              with ZipFile(archive, "w", ZIP_DEFLATED) as release:
                  for relative, source in sorted(files.items()):
                      release.write(source, relative.as_posix())

              with ZipFile(archive) as release:
                  names = set(release.namelist())
                  hidden = [name for name in names if any(part.startswith(".") for part in Path(name).parts)]
                  missing = sorted(path.as_posix() for path in required if path.as_posix() not in names)
                  if hidden or missing:
                      raise ValueError(f"Invalid release archive: hidden={hidden}, missing={missing}")
                  corrupt = release.testzip()
                  if corrupt:
                      raise ValueError("Corrupt release entry: " + corrupt)
              print(f"Packaged {len(files)} files; verified {len(required)} assembly outputs.")


          if __name__ == "__main__":
              package_release(Path.cwd(), Path(sys.argv[1]), Path(sys.argv[2]))
          PY

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Build C# plugins
        shell: bash
        run: .Tools/build-csharp.sh "$RUNNER_TEMP/mod"

      - name: Package release
        shell: bash
        run: *package_release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/Deep-Diving-Armory.zip" --verify-tag --generate-notes
